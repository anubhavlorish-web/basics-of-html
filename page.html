<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Product Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      padding: 30px;
    }
    .card {
      background-color: skyblue;
      width: 300px;
      padding: 15px;
      border: 2px solid black;
      margin: 0 auto;
     border-radius: 2ch;
    }

    
    .card img {
      width: 100%;
      border: 1px solid black;
      border-radius: 2ch;
    }

    .title {
      font-size: 25px;
      font-family: 'Courier New', Courier, monospace;
      font-style: italic;
      font-weight: bold;
      
    }

    
    .description {
      color:black;
      font-size: 14px;
    }

  
    .addtocart {
      background-color:gold;
      color:black;
      width: 100%;
      font-size: 20px;
      border: 1px solid black;
      border-radius: 1ch;
    }

    /* .addtocart:hover {
      background-color:red;
    } */
  </style>
</head>
<body>
  <div class="card">
    <img src="images.jpeg" alt="Headphones">

    <h2 class="title">Wireless Headphones</h2>
    <p class="description">High quality wireless headphones with great sound and long battery life.</p>
    
    <button class="addtocart">Add to Cart</button>
  </div>

</body>
</html>

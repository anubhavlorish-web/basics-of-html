<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
        background-color: white;
      padding: 30px;
        }
        .container{
            background-color: aqua;
            border: 1px solid black;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            border: 1px solid black;
            height: 90%;
            width: 35%;
            margin: auto;
            background-color: pink;
            border-radius: 10px;
        }
        .box1{
            height: 60%;
            border: 1px solid black;
            border-radius: 10px;
            margin: 10px;
            
        }
        .box1 img{
            height: 100%;
            width: 100%;
            border-radius: 10px;
            transition: 0.5s ease-in-out;
            
        }
        .box1 img:hover{ 
            scale: 1.2;
        }
        .box2{
            height: 35%;
            border: 1px solid black;
            margin: 10px;
            background-color: black;
            border-radius: 10px;

        }
        .title{
            color: gold;
            margin-top: 10px;
            margin-left: 30px;
             font-size: 60px;
            font-family: 'Courier New', Courier, monospace;
            font-style: italic;
            font-weight: bold;
        }
        .qwerty{
            color: aliceblue;
            margin-left: 30px;
            margin-top: 5px;
            font-size: 25px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .addtocart{
            width: 100%;
            color: black;
            font-size: 20px;
            background-color: gold;
        }
        .addtocart:hover{
            background-color: red;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="box1">
                 <img src="images.jpeg" alt="Headphones">
            </div>

            <div class="box2">
                <h1 class="title">HEADPHONES</h1>
                <p class="qwerty">High quality wireless headphones with great sound and long battery life</p>
                <button class="addtocart">Add to Cart</button>
            </div>
        </div>

    </div>
</body>
</html>

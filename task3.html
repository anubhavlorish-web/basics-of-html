<!DOCTYPE html>
<html lang="en">
<head>

            gap: 20px;
        }
        .box{
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div class="gridTable">
        <div class="box"></div>

        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
